# PenePene — Configuration Nginx anti-cache pour les médias et contenus supprimés
# À inclure dans le bloc server {} du vhost du site (ex: /etc/nginx/sites-available/penepene)
#
# Objectif : après suppression d'images/contenus en base, le navigateur et
# Nginx ne doivent plus servir les anciennes versions depuis leur cache.

server {
    # ... configuration existante ...

    # ------------------------------------------------------------------
    # 1. Fichiers statiques (css/js/images) : forcer la revalidation
    # ------------------------------------------------------------------
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|webp|svg|avif)$ {
        # no-cache + must-revalidate : le navigateur doit revalider à chaque requête (ETag/Last-Modified)
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "Thu, 01 Jan 1970 00:00:00 GMT" always;

        # Désactive le proxy_cache si un cache Nginx (fastcgi_cache / proxy_cache) est actif
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        fastcgi_no_cache 1;
        fastcgi_cache_bypass 1;

        # ETag fort pour que la revalidation renvoie 304 si le fichier n'a pas changé
        etag on;

        try_files $uri =404;
        access_log off;
    }

    # ------------------------------------------------------------------
    # 2. Médias servis via le lien symbolique /storage (Laravel)
    # ------------------------------------------------------------------
    location /storage/ {
        add_header Cache-Control "no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
        fastcgi_no_cache 1;
        fastcgi_cache_bypass 1;

        # 404 immédiat si le fichier a été supprimé du disque (au lieu de servir l'ancien cache)
        try_files $uri =404;
    }

    # ------------------------------------------------------------------
    # 3. Routes dynamiques Laravel : jamais mises en cache
    # ------------------------------------------------------------------
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # ------------------------------------------------------------------
    # 4. Désactiver tout cache FastCGI si présent (à mettre au niveau server{})
    # ------------------------------------------------------------------
    # fastcgi_cache off;
    # fastcgi_cache_path /var/cache/nginx/fastcgi levels=1:2 keys_zone=APP:50m inactive=1d;
    # Si ce bloc existait, le SUPPRIMER pour un pur-chaînage frais à chaque requête.

    # ------------------------------------------------------------------
    # 5. PHP-FPM : pas de cache applicatif Nginx
    # ------------------------------------------------------------------
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_hide_header X-Powered-By;

        # Ne jamais mettre en cache les réponses dynamiques
        fastcgi_no_cache 1;
        fastcgi_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }
}

